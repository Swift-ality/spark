plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

tasks.withType(JavaCompile) {
    // override, compile targeting J17
    options.release = 17
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenLocal()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()

    implementation(project(':spark-common')) {
        // use the java11+ bytesocks client instead
        exclude group: 'me.lucko', module: 'bytesocks-java-client'
        exclude group: 'org.java_websocket', module: 'Java-WebSocket'
    }

    implementation 'me.lucko:bytesocks-java-client-j11:1.0-SNAPSHOT'
}
