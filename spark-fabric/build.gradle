import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'com.gradleup.shadow'
}

tasks.withType(JavaCompile).configureEach {
    // override, compile targeting J17
    options.release = 17
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven {
        url 'https://maven.nucleoid.xyz/'
        content {
            includeGroup('eu.pb4')
        }
    }
    mavenLocal()
}

configurations {
    shade
    implementation.extendsFrom shade

}

dependencies {
    // https://modmuss50.me/fabric.html
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'

    Set<String> apiModules = [
            "fabric-api-base",
            "fabric-command-api-v2",
            "fabric-lifecycle-events-v1"
    ]

    // Add each module as a dependency
    apiModules.forEach {
        modImplementation(fabricApi.module(it, '0.92.6+1.20.1'))
    }

    include(modImplementation('me.lucko:fabric-permissions-api:0.3.1'))
    modImplementation 'eu.pb4:placeholder-api:2.1.4+1.20.1'

    shade(project(':spark-common')) {
        // use the java11+ bytesocks client instead
        exclude group: 'me.lucko', module: 'bytesocks-java-client'
        exclude group: 'org.java_websocket', module: 'Java-WebSocket'
    }

    shade 'me.lucko:bytesocks-java-client-j11:1.0-SNAPSHOT'

    shade project(path: ':spark-minecraft', configuration: 'namedElements')
}


processResources {
    // Declared as task inputs. Gradle does not track the values passed to expand(), so
    // processResources stays UP-TO-DATE when only the version changes - while shadowJar's
    // archiveFileName, which IS tracked, updates. An incremental build then produces a jar named
    // for the new version whose plugin descriptor still declares the old one, and spark stamps
    // that descriptor's version into every profile it exports.
    inputs.property 'pluginVersion', project.pluginVersion
    inputs.property 'pluginDescription', project.pluginDescription

    inputs.property 'version', project.version

    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand (
                'pluginVersion': project.pluginVersion,
                'pluginDescription': project.pluginDescription
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'fabric.mod.json'
    }
}

license {
    exclude '**/smap/SourceMap.java'
}

shadowJar {
    archiveFileName = "spark-fabric-${project.pluginVersion}-dev.jar"
    configurations = [project.configurations.shade]

    relocate 'net.kyori.adventure', 'me.lucko.spark.lib.adventure'
    relocate 'net.kyori.examination', 'me.lucko.spark.lib.adventure.examination'
    relocate 'net.kyori.option', 'me.lucko.spark.lib.adventure.option'
    relocate 'net.bytebuddy', 'me.lucko.spark.lib.bytebuddy'
    relocate 'com.google.protobuf', 'me.lucko.spark.lib.protobuf'
//    relocate 'org.objectweb.asm', 'me.lucko.spark.lib.asm'
    relocate 'one.profiler', 'me.lucko.spark.lib.asyncprofiler'
    relocate 'me.lucko.bytesocks.client', 'me.lucko.spark.lib.bytesocks'

    project.applyExcludes(delegate)

    dependencies {
        exclude(dependency('org.ow2.asm::'))
    }

    mergeServiceFiles()
}

tasks.register('remappedShadowJar', RemapJarTask) {
    dependsOn tasks.shadowJar
    inputFile = tasks.shadowJar.archiveFile
    addNestedDependencies = true
    archiveFileName = "spark-${project.pluginVersion}-fabric-1.20.1.jar"
}

tasks.assemble.dependsOn tasks.remappedShadowJar

artifacts {
    archives remappedShadowJar
}
